services:
  - type: web
    name: campus-career
    runtime: python
    plan: free
    region: singapore
    buildCommand: "echo no build step"
    startCommand: "python server.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: CC_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
